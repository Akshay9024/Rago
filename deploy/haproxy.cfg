global
    daemon
    maxconn 8192
    log /dev/log local0
    tune.ssl.default-dh-param 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    timeout connect 5s
    timeout client 60s
    timeout server 120s
    timeout tunnel 3600s

frontend rago_api_frontend
    bind *:80
    bind *:443 ssl crt /etc/ssl/rago.pem
    http-request redirect scheme https unless { ssl_fc }
    default_backend rago_api_backend

    acl rate_limit_exceeded req.hdr(Authorization) -m found
    http-request track-sc0 src table rago_api_backend
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

backend rago_api_backend
    balance leastconn
    option httpchk GET /health HTTP/1.1\r\nHost:\ rago
    http-check expect status 200

    stick-table type ip size 100k expire 30s store http_req_rate(10s)

    server worker0 127.0.0.1:8000 check inter 10s fall 3 rise 2 weight 1
    server worker1 127.0.0.1:8001 check inter 10s fall 3 rise 2 weight 1 backup

frontend rago_metrics
    bind *:9090
    default_backend rago_prometheus

backend rago_prometheus
    server prometheus 127.0.0.1:9091 check
