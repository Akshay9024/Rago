listen: 0.0.0.0:4222
http: 0.0.0.0:8222
server_name: rago-nats

max_connections: 4096
max_payload: 8MB
write_deadline: 10s

jetstream {
    store_dir: /data/nats/jetstream
    max_memory_store: 4GB
    max_file_store: 20GB
}

accounts {
    rago_account {
        jetstream: enabled
        users [
            { user: rago, password: $NATS_PASSWORD }
        ]
        limits {
            max_connections: 512
            max_subscriptions: 4096
            max_payload: 8MB
        }
    }
}

cluster {
    name: rago-cluster
    listen: 0.0.0.0:6222
    routes: [
        nats-route://$NATS_PEER_HOST:6222
    ]
}
